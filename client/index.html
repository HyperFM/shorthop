<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>ShortHop</title>
    <meta name="description" content="Shared routes. Real connections. A micro-rideshare for Lexington, KY." />
    <meta name="application-name" content="ShortHop" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShortHop" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/app-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: #000;
        background-color: #000;
      }

      body.sh-splash-active {
        overflow: hidden !important;
      }

      [class*="share-your-feedback"],
      [class*="feedback"],
      iframe[src*="feedback"],
      #replit-feedback-button,
      .replit-ui-theme-root,
      div[id*="feedback"],
      button[class*="feedback"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        left: -9999px !important;
      }

      #sh-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #sh-splash video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #sh-splash.fade-out {
        animation: splashFade 0.45s ease-out forwards;
      }

      @keyframes splashFade {
        to { opacity: 0; }
      }
    </style>
    <meta property="og:title" content="ShortHop" />
    <meta property="og:description" content="Shared routes. Real connections. A micro-rideshare for Lexington, KY." />
    <meta property="og:image" content="/app-icon.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body class="sh-splash-active">
    <div id="sh-splash">
      <video id="sh-splash-video" autoplay muted playsinline preload="auto">
        <source src="/splash.mp4" type="video/mp4" />
        <source src="/splash.mov" type="video/quicktime" />
      </video>
    </div>
    <div id="root"></div>
    <script>
      (function() {
        var vid = document.getElementById('sh-splash-video');
        var splash = document.getElementById('sh-splash');
        var appReady = false;
        var videoEnded = false;
        var dismissed = false;

        function dismiss() {
          if (dismissed) return;
          if (!appReady || !videoEnded) return;
          dismissed = true;
          splash.classList.add('fade-out');
          setTimeout(function() {
            splash.remove();
            document.body.classList.remove('sh-splash-active');
          }, 500);
        }

        vid.addEventListener('ended', function() {
          videoEnded = true;
          dismiss();
        });

        vid.addEventListener('error', function() {
          videoEnded = true;
          dismiss();
        });

        setTimeout(function() {
          videoEnded = true;
          dismiss();
        }, 6000);

        window.__splashReady = function() {
          appReady = true;
          dismiss();
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
