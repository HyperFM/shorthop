<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>ShortHop</title>
    <meta name="description" content="Shared routes. Real connections. A micro-rideshare for Lexington, KY." />
    <meta name="application-name" content="ShortHop" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShortHop" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/app-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preload" as="image" href="/app-icon-192.png" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        padding-top: env(safe-area-inset-top);
        min-height: 100vh;
        min-height: 100dvh;
      }

      [class*="share-your-feedback"],
      [class*="feedback"],
      iframe[src*="feedback"],
      #replit-feedback-button,
      .replit-ui-theme-root,
      div[id*="feedback"],
      button[class*="feedback"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        left: -9999px !important;
      }

      #sh-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #sh-splash .splash-ring {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40%;
        height: 35%;
      }
      #sh-splash .splash-ring img {
        max-width: 55%;
        max-height: 55%;
        object-fit: contain;
        border-radius: 14px;
        animation: pulseIcon 2s ease-in-out infinite;
      }
      #sh-splash .splash-ring::before {
        content: '';
        position: absolute;
        inset: -40px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(249,115,22,0.5) 0%, rgba(249,115,22,0.25) 20%, rgba(249,115,22,0.08) 45%, rgba(249,115,22,0.02) 65%, transparent 80%);
        animation: pulseGlow 2s ease-in-out infinite;
        z-index: 0;
      }
      #sh-splash .splash-ring::after {
        content: '';
        position: absolute;
        inset: -120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(249,115,22,0.2) 0%, rgba(249,115,22,0.08) 20%, rgba(249,115,22,0.02) 40%, transparent 60%);
        animation: stretchGlow 3s ease-in-out infinite;
        z-index: -1;
      }
      @keyframes pulseIcon {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(249,115,22,0.6)) drop-shadow(0 0 40px rgba(249,115,22,0.4)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 30px rgba(249,115,22,0.9)) drop-shadow(0 0 60px rgba(249,115,22,0.6)) drop-shadow(0 0 100px rgba(249,115,22,0.35)); }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      @keyframes stretchGlow {
        0% { transform: scale(0.6); opacity: 0; }
        50% { transform: scale(1.2); opacity: 0.5; }
        100% { transform: scale(1.8); opacity: 0; }
      }
      #sh-splash.fade-out {
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }
    </style>
    <link rel="preload" as="image" href="/splash.png" />
    <meta property="og:title" content="ShortHop" />
    <meta property="og:description" content="Shared routes. Real connections. A micro-rideshare for Lexington, KY." />
    <meta property="og:image" content="/app-icon.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="sh-splash">
      <div class="splash-ring">
        <img src="/splash.png" alt="ShortHop" />
      </div>
    </div>
    <div id="root"></div>
    <script>
      if (navigator.userAgent.indexOf('ShortHop-iOS') !== -1) {
        document.getElementById('sh-splash').remove();
      } else {
        (function() {
          var splash = document.getElementById('sh-splash');
          setTimeout(function() {
            splash.classList.add('fade-out');
            setTimeout(function() { splash.remove(); }, 600);
          }, 6000);
        })();
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
