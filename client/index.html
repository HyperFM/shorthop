<!DOCTYPE html>
<html lang="en" style="background:#000;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>ShortHop</title>
    <meta name="description" content="Shared routes. Real connections. A micro-rideshare for Lexington, KY." />
    <meta name="application-name" content="ShortHop" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShortHop" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/app-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="preload" as="image" href="/app-icon-192.png" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: #000 !important;
        background-color: #000 !important;
      }

      body.sh-splash-done {
        background: unset !important;
        background-color: unset !important;
      }

      body.sh-splash-active {
        overflow: hidden !important;
      }

      [class*="share-your-feedback"],
      [class*="feedback"],
      iframe[src*="feedback"],
      #replit-feedback-button,
      .replit-ui-theme-root,
      div[id*="feedback"],
      button[class*="feedback"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        left: -9999px !important;
      }

      #sh-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #sh-splash video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #sh-splash.fade-out {
        animation: splashFade 0.45s ease-out forwards;
      }

      @keyframes splashFade {
        to { opacity: 0; }
      }
    </style>
    <meta property="og:title" content="ShortHop" />
    <meta property="og:description" content="Shared routes. Real connections. A micro-rideshare for Lexington, KY." />
    <meta property="og:image" content="/app-icon.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
  </head>
  <body class="sh-splash-active" style="background:#000 !important;">
    <div id="sh-splash">
      <div id="sh-splash-icon" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:1;">
        <img src="/app-icon-192.png" alt="ShortHop" style="width:120px;height:120px;object-fit:contain;" />
      </div>
      <video id="sh-splash-video" autoplay playsinline preload="auto" style="position:relative;z-index:2;">
        <source src="/splash.mp4" type="video/mp4" />
        <source src="/splash.mov" type="video/quicktime" />
      </video>
    </div>
    <div id="root"></div>
    <script>
      (function() {
        var vid = document.getElementById('sh-splash-video');
        var splash = document.getElementById('sh-splash');
        var appReady = false;
        var videoEnded = false;
        var dismissed = false;

        vid.play().catch(function() {
          vid.muted = true;
          vid.play().catch(function() {});
        });

        function dismiss() {
          if (dismissed) return;
          if (!appReady || !videoEnded) return;
          dismissed = true;
          splash.classList.add('fade-out');
          setTimeout(function() {
            splash.remove();
            document.body.classList.remove('sh-splash-active');
            document.body.classList.add('sh-splash-done');
            document.body.style.background = '';
            document.documentElement.style.background = '';
          }, 500);
        }

        vid.addEventListener('ended', function() {
          videoEnded = true;
          dismiss();
        });

        vid.addEventListener('error', function() {
          videoEnded = true;
          dismiss();
        });

        setTimeout(function() {
          videoEnded = true;
          dismiss();
        }, 4000);

        window.__splashReady = function() {
          appReady = true;
          dismiss();
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
