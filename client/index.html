<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>ShortHop</title>
    <meta name="description" content="Shared routes. Real connections. A micro-rideshare for Lexington, KY." />
    <meta name="application-name" content="ShortHop" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShortHop" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/app-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2a9d5c" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1a2e23;
        min-height: 100vh;
        min-height: 100dvh;
      }

      [class*="share-your-feedback"],
      [class*="feedback"],
      iframe[src*="feedback"],
      #replit-feedback-button,
      .replit-ui-theme-root,
      div[id*="feedback"],
      button[class*="feedback"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        left: -9999px !important;
      }

      #sh-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a2e23;
        transition: opacity 0.5s ease-out;
      }

      #sh-preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #sh-preloader .logo-ring {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 3px solid rgba(42, 157, 92, 0.2);
        border-top-color: #2a9d5c;
        animation: preloader-spin 0.8s linear infinite;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #sh-preloader .logo-inner {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        overflow: hidden;
        background: #223d2e;
      }

      #sh-preloader .logo-inner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #sh-preloader .brand-text {
        margin-top: 20px;
        font-family: 'Outfit', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 22px;
        color: #f9fafb;
        letter-spacing: -0.5px;
      }

      #sh-preloader .tagline {
        margin-top: 6px;
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 0.5px;
      }

      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <meta property="og:title" content="ShortHop" />
    <meta property="og:description" content="Shared routes. Real connections. A micro-rideshare for Lexington, KY." />
    <meta property="og:image" content="/app-icon.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="sh-preloader">
      <div class="logo-ring">
        <div class="logo-inner">
          <img src="/app-icon-192.png" alt="" />
        </div>
      </div>
      <div class="brand-text">ShortHop</div>
      <div class="tagline">Shared routes. Real connections.</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
