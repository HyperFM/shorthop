workflows:
  ios-workflow:
    name: ShortHop iOS
    environment:
      xcode: 16.3
      node: 20.19.4
    working_directory: expo-ios-wrapper
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          npm install expo --legacy-peer-deps
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Build iOS
        script: |
          xcodebuild clean archive \
            -workspace ios/ShortHop.xcworkspace \
            -scheme ShortHop \
            -archivePath ../build/ShortHop.xcarchive \
            -sdk iphoneos
    artifacts:
      - build/**/*.ipa
