workflows:
  ios-workflow:
    name: ShortHop iOS
    environment:
      xcode: 16.3
      node: 20.19.4
    scripts:
      - name: Install dependencies
        script: |
          cd expo-ios-wrapper
          npm install --legacy-peer-deps
          npm install expo --legacy-peer-deps
      - name: Expo prebuild
        script: |
          cd expo-ios-wrapper
          npx expo prebuild --platform ios --no-install
      - name: Build iOS
        script: |
          xcodebuild clean archive \
            -workspace expo-ios-wrapper/ios/shorthop.xcworkspace \
            -scheme shorthop \
            -archivePath build/ShortHop.xcarchive \
            -sdk iphoneos
    artifacts:
      - build/**/*.ipa
